name: Build Flutter APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with: 
        channel: 'stable'

    - name: Install dependencies & Build APK
      run: |
        PROJECT_DIR=$(dirname $(find . -name "pubspec.yaml" -not -path "*/.*" | head -n 1))
        cd "$PROJECT_DIR"
                echo "android.newDsl=false" >> android/gradle.properties
        flutter pub get
                flutter pub get

        echo "===== gradle.properties ====="
        cat android/gradle.properties
        echo "===== AGP version ====="
        grep -R "com.android.tools.build:gradle\|com.android.application" android --include="*.gradle" --include="*.gradle.kts"

        sed -i '/android {/a\    namespace "com.apivideo.live_stream"' ~/.pub-cache/hosted/pub.dev/apivideo_live_stream-1.0.7/android/build.gradle

        flutter build apk --release --no-pub --no-tree-shake-icons
                sed -i '/android {/a\    namespace "com.apivideo.live_stream"' ~/.pub-cache/hosted/pub.dev/apivideo_live_stream-1.0.7/android/build.gradle
        flutter build apk --release --no-pub --no-tree-shake-icons

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: "**/build/app/outputs/flutter-apk/app-release.apk"
