name: Build Flutter APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
        flutter-version: '3.29.0'
          channel: 'stable'
          
      - name: Build APK
        run: |
          PROJECT_DIR=$(dirname "$(find . -name pubspec.yaml -not -path '*/.*' | head -n 1)")
          cd "$PROJECT_DIR"
          flutter pub get
          sed -i '/android {/a\    namespace "com.apivideo.live_stream"' \
            ~/.pub-cache/hosted/pub.dev/apivideo_live_stream-1.0.7/android/build.gradle
          flutter build apk --release --no-pub --no-tree-shake-icons

      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: "**/build/app/outputs/flutter-apk/app-release.apk"
